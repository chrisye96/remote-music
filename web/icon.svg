  <circle cx="36" cy="66" r="42" fill="#f4f5f7"/>
  <circle cx="36" cy="66" r="28" fill="none" stroke="#b0185e" stroke-opacity=".2" stroke-width="1.5"/>
  <circle cx="36" cy="66" r="13" fill="#57534e"/>
  <circle cx="36" cy="66" r="2.5" fill="#f4f5f7"/>
  <path d="M80 18 L72 44 L58 58" fill="none" stroke="#1d1d1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="52" y="54.5" width="12" height="7" rx="2" transform="rotate(45 58 58)" fill="#1d1d1f"/>
  <circle cx="80" cy="18" r="9" fill="#1d1d1f"/>
  <circle cx="80" cy="18" r="3.5" fill="#f4f5f7"/>
</svg>
