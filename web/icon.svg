<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Logo L3 (tonearm). Raspberry tile (accent), graphite record label (secondary).
       Full-bleed square: iOS and browsers apply their own corner mask.
       Known limits: the tonearm is unreadable below about 29px. -->
